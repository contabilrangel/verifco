name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrações em dia com o schema
        run: pnpm --filter @verifco/api db:check
      - name: Tipagem
        run: pnpm typecheck
      # CSS inválido (bloco sem fechar) derruba o build e a aplicação inteira; classes repetidas
      # entre módulos se sobrescrevem. Roda antes de tudo para o erro aparecer cedo e com o arquivo.
      - name: CSS da web (sintaxe e classes por módulo)
        run: pnpm check:css
      - name: Build da web
        run: pnpm --filter @verifco/web build
      - name: Testes
        run: pnpm test
