x-api: &api
  build:
    context: .
    dockerfile: deploy/api.Dockerfile
  restart: unless-stopped
  stop_grace_period: 20s
  environment: &api-env
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3333"
    DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL}
    PLATFORM_DATABASE_URL: ${PLATFORM_DATABASE_URL:?Defina PLATFORM_DATABASE_URL}
    DB_SYNC: migrate
    JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY}
    WEB_URL: ${APP_URL:?Defina APP_URL}
    API_URL: ${APP_URL:?Defina APP_URL}
    CORS_ORIGINS: ${CORS_ORIGINS:-${APP_URL:?Defina APP_URL}}
    TRUST_PROXY: "2"
    STORAGE_DIR: /app/storage
    RUN_WORKER: "false"
    JOB_CONCURRENCY: "4"
    SMTP_URL: ${SMTP_URL:-}
    SMTP_FROM: ${SMTP_FROM:-Verifco <nao-responda@verifco.com.br>}
  volumes:
    - uploads:/app/storage
  networks:
    - backend
    - dokploy-network
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:3333/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 15s
    timeout: 5s
    start_period: 60s
    retries: 5

services:
  api:
    <<: *api

  worker:
    <<: *api
    environment:
      <<: *api-env
      RUN_WORKER: "true"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  dokploy-network:
    external: true
  backend:

volumes:
  # Reservas dos volumes da instalação anterior; não apague durante a migração.
  database:
  platform-database:
  uploads:
