map $http_x_forwarded_proto $verifco_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    # acima dos limites da API (25 MB por arquivo, 100 MB por envio), que responde com a mensagem traduzida
    client_max_body_size 110m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # compressão dos textos (JS, CSS, JSON, SVG); binários (imagens, PDFs) não comprimem
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    include /etc/nginx/snippets/verifco-security-headers.conf;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # nome exclusivo na rede backend: "api" pode existir em outros projetos da dokploy-network
        set $verifco_api http://verifco-api:3333;
        proxy_pass $verifco_api;
        # a API já envia nosniff nos downloads; o cabeçalho único vem do snippet
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $verifco_scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/verifco-security-headers.conf;
    }

    location = / {
        if ($host = painel.verifco.com.br) {
            return 302 /sistema;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/verifco-security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob: data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/verifco-security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob: data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    }
}
