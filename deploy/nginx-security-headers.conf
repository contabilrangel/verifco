# Cabeçalhos de segurança de todas as respostas da web e da API.
# O nginx não herda add_header do server em locations que definem o próprio
# add_header; por isso este arquivo é incluído no server e nessas locations.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
